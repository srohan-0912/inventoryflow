
services:
  api:
    build: .
    container_name: inventoryflow_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://inventoryflow_user:inventoryflow_password@db:5432/inventoryflow
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: inventoryflow_db
    environment:
      POSTGRES_DB: inventoryflow
      POSTGRES_USER: inventoryflow_user
      POSTGRES_PASSWORD: inventoryflow_password
    ports:
      - "5434:5432"
    volumes:
      - inventoryflow_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventoryflow_user -d inventoryflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: inventoryflow_redis
    ports:
      - "6379:6379"
    volumes:
      - inventoryflow_redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  inventoryflow_postgres_data:
  inventoryflow_redis_data: